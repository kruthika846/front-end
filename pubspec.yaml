name: logbridge
description: LogBridge — Digital Auxiliary Engine Logbook (MVP)
publish_to: 'none'
version: 0.4.3+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  file_picker: ^12.0.0
  signature: ^5.5.0
  intl: ^0.19.0
  local_auth: ^2.3.0
  dio: ^5.4.3
  shared_preferences: ^2.2.3
  crypto: ^3.0.8
  flutter_secure_storage: ^11.2.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/engine_parameters.json
