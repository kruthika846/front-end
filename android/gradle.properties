org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Everything this project needs (NDK, platforms, build-tools) is already
# installed. Without this, AGP re-verifies SDK packages via `sdkmanager`,
# which shells out to a native "Android CLI" helper that crashes outright
# on this machine (confirmed via Windows crash dumps) even though the
# packages it's checking for are already present. This stops that check.
android.builder.sdkDownload=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
